# Supabase CLI Configuration for Game-Over App

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "exp://localhost:8081"
additional_redirect_urls = ["gameover://", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
redirect_uri = "env(SUPABASE_AUTH_APPLE_REDIRECT_URI)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "env(SUPABASE_AUTH_GOOGLE_REDIRECT_URI)"

[auth.external.facebook]
enabled = true
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_SECRET)"
redirect_uri = "env(SUPABASE_AUTH_FACEBOOK_REDIRECT_URI)"

[analytics]
enabled = false
port = 54327
vector_port = 54328

# ─── Edge Functions ───────────────────────────────────────────────────────────
# These three do NOT receive a Supabase JWT and must not be gated on one:
# the two cron jobs send `Authorization: Bearer <CRON_SECRET>` and Stripe sends
# its own signature header. With the gateway's JWT check on, the request is
# rejected as UNAUTHORIZED_INVALID_JWT_FORMAT before the function ever runs,
# and each function's own authorization check never gets a say.
#
# This section exists because that setting previously lived only in the
# dashboard: a plain `supabase functions deploy <name>` silently re-enabled the
# check and took the function down. Recorded here, every deploy carries it.
[functions.send-final-briefing]
verify_jwt = false

[functions.process-payment-reminders]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
