# Supabase CLI Configuration for Game-Over App

# ── Cron-triggered functions: JWT verification MUST stay off ──────────────────
# These two are called by pg_cron with a CRON_SECRET bearer token, not a user JWT.
# With verify_jwt = true the platform rejects the call with
# 401 UNAUTHORIZED_INVALID_JWT_FORMAT *before* the function runs, so the guard
# inside the code never gets a say and the job fails silently every morning.
#
# This is not theoretical: on 2026-07-29 deploy-edge-functions.yml redeployed
# send-final-briefing without --no-verify-jwt, flipped it to true, and broke the
# cron call 15 minutes after it had been fixed. Declaring it here makes the
# setting part of the repo instead of a flag someone has to remember.
# Both functions authenticate themselves via constant-time CRON_SECRET compare.

[functions.send-final-briefing]
verify_jwt = false

[functions.process-payment-reminders]
verify_jwt = false

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "exp://localhost:8081"
additional_redirect_urls = ["gameover://", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
redirect_uri = "env(SUPABASE_AUTH_APPLE_REDIRECT_URI)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "env(SUPABASE_AUTH_GOOGLE_REDIRECT_URI)"

[auth.external.facebook]
enabled = true
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_SECRET)"
redirect_uri = "env(SUPABASE_AUTH_FACEBOOK_REDIRECT_URI)"

[analytics]
enabled = false
port = 54327
vector_port = 54328
